{% extends "/home/baseru.html" %}
{% block title %}
    <title>{{ news.name }}</title>
{% endblock %}
{% block content %}
    <style>
      .news-details {
        max-width: 800px;
        margin: 0 auto;
        padding: 30px;
        background-color: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .news-details h1 {
        margin-top: 10px;
        font-size: 36px;
        color: #333;
        margin-bottom: 10px;
      }

      .news-details p {
        font-size: 20px;
        color: #555;
        margin-bottom: 20px;
        line-height: 1.6;
      }

      .news-details img {
        max-width: 100%;
        height: auto;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      @media (max-width: 768px) {
        .news-details {
          padding: 20px;
        }

        .news-details h1 {
          font-size: 28px;
        }

        .news-details p {
          font-size: 18px;
        }
      }
    </style>
    <div class="news-details">
        <img src="{{ url_for('static', filename='uploads/' + news.photo) }}" alt="News Photo">
        <h1>{{ news.name }}</h1>
        <p>{{ news.description }}</p>
    </div>
{% endblock %}
