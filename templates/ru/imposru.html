{% extends "/home/baseru.html" %}
{% block title %}
    <title>Важно | Новости</title>
{% endblock %}
{% block content %}
<style>
    .newsblock {
        max-width: 90%;
        margin: 0 auto;
        padding: 0 15px;
        background-color: white;
        border-radius: 15px;
    }
    
    /* Сетка новостей */
    .news-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr); /* 3 столбца */
        gap: 20px; /* Отступы между новостными блоками */
    }
    
    .news-item {
        padding: 15px;
        border-radius: 15px;
        background-color: rgba(230, 245, 255, 0.8);
        box-shadow: 0px 2px 10px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
    }
    
    .news-image {
        width: 100%;
        height: 250px;
        margin-bottom: 15px;
        border-radius: 10px;
    }
    
    .news-content {
        flex-grow: 1;
        width: 100%;
        text-align: center;
    }
    
    .page-title {
        font-size: 45px;
        margin: 10px 0;
        text-align: center;
        color: #333;
        font-weight: bold;
    }
    
    .news-title {
        font-size: 30px;
        margin: 10px 0;
        text-align: center;
    }
    
    .news-text {
        font-size: 20px;
        color: #666;
        margin-bottom: 10px;
        overflow: hidden;
        display: block;
    }
    
    .hidden-text {
        display: none;
        font-size: 26px;
    }
    
    .expand-button {
        color: black;
        border: none;
        border-radius: 30px;
        background-color: rgba(230, 245, 255, 0.8);
        padding: 10px 20px;
        cursor: pointer;
    }
    
    .expand-button:focus {
        outline: none;
    }
    
    /* Адаптивность для мобильных устройств */
    @media screen and (max-width: 900px) {
        .news-grid {
            grid-template-columns: repeat(2, 1fr); /* 2 столбца на экранах до 900px */
        }
    }
    
    @media screen and (max-width: 600px) {
        .news-grid {
            grid-template-columns: 1fr; /* 1 столбец на экранах до 600px */
        }
    
        .news-title {
            font-size: 20px;
            text-align: center;
        }
    
        .news-text {
            font-size: 16px;
        }
    
        .hidden-text {
            font-size: 16px;
        }
    }
    
</style>
<script>
  function redirectToPage(id) {
    window.location.href = '/impos/' + id;
  }
</script>
<div style="padding: 20px;">
    <div class="newsblock">
        <h1 class="page-title">Важная информация</h1>
        <div class="news-grid">
            {% for i in range(rows|length - 1, -1, -1) %}
                {% set row = rows[i] %}
                <div class="news-item">
                    <img src="{{ url_for('static', filename='uploads/' + row[3]) }}" alt="Image" class="news-image">
                    <div class="news-content">
                        <h2 class="news-title">{{ row[1] }}</h2>
                        <p class="news-text" id="content-{{ loop.index }}-excerpt">{{ row[2][:100] }}<span id="content-{{ loop.index }}-dots">...</span></p>
                        <button id="content-{{ loop.index }}-button" class="expand-button" onclick="redirectToPage('{{ row[0] }}')">&#9660; Читати далі</button>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock %}
